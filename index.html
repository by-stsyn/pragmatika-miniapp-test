<script>
(function() {
  let platform = 'web';
  let appOpenSent = false;

  function detectPlatform() {
    const search = window.location.search || "";
    if (window.vkBridge || search.includes("vk_user_id") || search.includes("vk_app_id")) {
      return "vk";
    }

    if (window.Telegram?.WebApp?.initDataUnsafe?.user) {
      return 'telegram';
    }

    if (window.MaxWebApp?.initDataUnsafe?.user) {
      return 'max';
    }

    return 'web';
  }

  function setUserId() {
    const params = new URLSearchParams(window.location.search);
    const vkId = params.get("vk_user_id");
    const tgId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id;
    const maxId = window.MaxWebApp?.initDataUnsafe?.user?.id;
    const uid = vkId || tgId || maxId || params.get("user_id") || params.get("userId");

    if (uid && window.ym) {
      ym(106985052, 'setUserID', uid.toString());
    }
  }

  function sendAnalytics() {
    if (!window.ym || appOpenSent) return;

    platform = detectPlatform();
    appOpenSent = true;

    ym(106985052, 'reachGoal', 'app_open');
    ym(106985052, 'reachGoal', 'platform_' + platform);
  }

  function waitMiniApp() {
    let attempts = 0;

    const timer = setInterval(() => {
      attempts++;

      if (window.Telegram?.WebApp || window.MaxWebApp || attempts > 40) {
        clearInterval(timer);

        try {
          if (window.Telegram?.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
          }

          if (window.MaxWebApp) {
            MaxWebApp.ready();
            MaxWebApp.expand();
          }
        } catch (e) {}

        setUserId();
        sendAnalytics();
      }
    }, 250);
  }

  waitMiniApp();

  setInterval(() => {
    if (window.ym) {
      ym(106985052, 'reachGoal', 'heartbeat');
    }
  }, 15000);

})();
</script>
